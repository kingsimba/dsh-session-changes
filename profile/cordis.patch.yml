# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: development
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
# Terminal tab (right sidebar): open the shell that belongs to the Session
# workspace. The dispatcher reads its own working directory -- which DSH sets
# to the Session workspace -- and starts, in that same directory:
#   \\wsl.localhost\<distro>\... -> wsl.exe -d <distro> --cd <linux path>
#   C:\..., D:\..., other shares  -> %ComSpec% (cmd.exe), as before
# Source: %USERPROFILE%\.dsh\bin\wsl-dispatch.cs
- id: terminal-controller
  name: "@deepseek-ai/dsh-api-terminal-controller"
  config:
    shell:
      path: 'C:\Users\kingsimba\.dsh\bin\wsl-dispatch.exe'
      name: Workspace shell (WSL / cmd)
      args: []
